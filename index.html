<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conversational Agent – Bachelorarbeit</title>

    <!-- Tailwind CSS über CDN (kein Build-Step nötig) -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-gray-100 h-screen flex flex-col">

    <!-- Szenario-Banner oben -->
    <header class="bg-indigo-700 text-white px-6 py-3 shadow-md">
      <p class="text-xs font-semibold uppercase tracking-widest text-indigo-300">Szenario</p>
      <h1 class="text-base font-medium leading-snug">
        Konfliktgespräch: Mitarbeiterin fühlt sich durch Kollegin übergangen
      </h1>
    </header>

    <!-- Chat-Bereich (scrollbar) -->
    <main
      id="chat-container"
      class="flex-1 overflow-y-auto px-4 py-6 space-y-1"
    >
      <!-- Nachrichten werden per app.js eingefügt -->

      <!-- Begrüßungsnachricht des CA -->
      <div class="flex mb-3 justify-start">
        <div class="max-w-xs lg:max-w-md px-4 py-2 rounded-2xl rounded-bl-sm text-sm bg-white text-gray-800 shadow-sm">
          Hallo! Ich bin bereit für unser Gespräch. Wie kann ich Ihnen helfen?
        </div>
      </div>
    </main>

    <!-- Eingabebereich unten -->
    <footer class="bg-white border-t border-gray-200 px-4 py-3">
      <div class="flex items-end gap-2 max-w-3xl mx-auto">
        <textarea
          id="user-input"
          rows="1"
          placeholder="Nachricht eingeben…"
          class="flex-1 resize-none rounded-xl border border-gray-300 px-4 py-2 text-sm text-gray-800
                 focus:outline-none focus:ring-2 focus:ring-indigo-400 transition
                 overflow-hidden"
          style="max-height: 120px;"
          oninput="this.style.height = 'auto'; this.style.height = this.scrollHeight + 'px';"
        ></textarea>

        <button
          id="send-button"
          class="shrink-0 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50
                 text-white text-sm font-medium px-5 py-2 rounded-xl transition"
        >
          Senden
        </button>
      </div>
    </footer>

    <!-- Konfiguration und App-Logik -->
    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
